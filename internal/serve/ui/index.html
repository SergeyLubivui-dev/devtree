<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devtree</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>%F0%9F%8C%B2</text></svg>">
</head>
<body>

<!--
  Three regions butted together, no gaps: a rail of sections, a panel that
  lists whatever the rail is pointing at, and the drawing. Everything that
  edits happens in the drawer, which comes in from the right over all three.
-->
<div class="app">

  <nav class="rail" aria-label="Sections">
    <div class="rail-mark" data-glyph="tree" title="devtree"></div>

    <button class="rail-btn" data-section="plan" aria-pressed="true" title="Plan">
      <span data-glyph="nodes"></span>
    </button>
    <button class="rail-btn" data-section="docs" aria-pressed="false" title="Documents">
      <span data-glyph="document-code"></span>
    </button>

    <div class="rail-gap"></div>

    <button class="rail-btn" id="theme-btn" title="Light or dark">
      <span class="swap">
        <span class="swap-a" data-glyph="monitor"></span>
        <span class="swap-b" data-glyph="eye"></span>
      </span>
    </button>
    <button class="rail-btn" id="write-btn" title="Write the outputs">
      <span data-glyph="flash"></span>
      <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
    </button>
  </nav>

  <aside class="side" aria-label="Panel">
   <div class="side-inner">
    <header class="side-head">
      <h1 id="side-title" class="shimmer">Plan</h1>
      <div class="side-acts">
        <button class="ghost-btn" id="side-add" title="New">
          <svg viewBox="0 0 24 24" class="ui"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="ghost-btn" id="side-collapse" title="Collapse the panel">
          <svg viewBox="0 0 24 24" class="ui"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M10 4.5v15"/></svg>
        </button>
      </div>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" class="ui"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="search" type="search" placeholder="Search..." autocomplete="off" spellcheck="false">
    </div>

    <div class="seg" id="scope" role="tablist" aria-label="Scope">
      <span class="seg-pill" aria-hidden="true"></span>
      <button role="tab" data-scope="all" aria-selected="true">All</button>
      <button role="tab" data-scope="open" aria-selected="false">Open</button>
    </div>

    <div class="list" id="list" tabindex="-1"></div>

    <footer class="side-foot" id="side-foot"></footer>
   </div>
  </aside>

  <main class="main">
    <header class="main-head">
      <button class="crumb" id="crumb" aria-haspopup="dialog">
        <span id="crumb-name" class="shimmer">&nbsp;</span>
        <svg viewBox="0 0 24 24" class="ui chev"><path d="m7 10 5 5 5-5"/></svg>
      </button>

      <span class="rollup" id="rollup"></span>

      <div class="grow"></div>

      <div class="seg" id="views" role="tablist" aria-label="View">
        <span class="seg-pill" aria-hidden="true"></span>
        <button role="tab" data-view="tree" aria-selected="true">Tree</button>
        <button role="tab" data-view="board" aria-selected="false">Board</button>
        <button role="tab" data-view="page" aria-selected="false">Page</button>
        <button role="tab" data-view="mermaid" aria-selected="false">Mermaid</button>
        <button role="tab" data-view="yaml" aria-selected="false">YAML</button>
      </div>
    </header>

    <div class="stage" id="stage" tabindex="-1"></div>

    <!-- Follows the hovered card. One button, moved, rather than one per node. -->
    <button class="node-add" id="node-add" hidden title="Add a task under this one">
      <svg viewBox="0 0 24 24" class="ui"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <header class="drawer-head">
    <h2 id="drawer-title"></h2>
    <button class="ghost-btn" id="drawer-close" title="Close (Esc)">
      <svg viewBox="0 0 24 24" class="ui"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
  <footer class="drawer-foot" id="drawer-foot"></footer>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
