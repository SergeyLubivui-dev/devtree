<svg xmlns="http://www.w3.org/2000/svg" width="800" height="266" viewBox="0 0 800 266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="How devtree is built"><style>
@keyframes dt-flow { to { stroke-dashoffset: -16 } }
@keyframes dt-grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes dt-spin { to { transform: rotate(360deg) } }
.dt-flow { animation: dt-flow 1.1s linear infinite }
.dt-grow { animation: dt-grow .9s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: left center }
.dt-spin { animation: dt-spin 8s linear infinite; transform-box: fill-box; transform-origin: center }
@media (prefers-reduced-motion: reduce) {
  .dt-flow, .dt-grow, .dt-spin { animation: none }
}
</style><rect x="0.5" y="0.5" width="799.0" height="265.0" rx="12.0" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="24.0" y="44.0" width="752.0" height="182.0" rx="10.0" fill="#ffffff" stroke="#d1d9e0"/><rect x="25.0" y="54.0" width="3.0" height="20.0" rx="1.5" fill="#bf8700"/><text x="38.0" y="66.0" font-size="12.0" fill="#1f2328" font-weight="600">internal/cli</text><text x="762.0" y="66.0" font-size="10.5" fill="#59636e" text-anchor="end">flags, dispatch, and every line the user sees</text><rect x="46.0" y="78.0" width="708.0" height="136.0" rx="10.0" fill="#ffffff" stroke="#d1d9e0"/><rect x="47.0" y="88.0" width="3.0" height="20.0" rx="1.5" fill="#1a7f37"/><text x="60.0" y="100.0" font-size="12.0" fill="#1f2328" font-weight="600">internal/store · internal/render · internal/scaffold</text><text x="740.0" y="100.0" font-size="10.5" fill="#59636e" text-anchor="end">file format, Mermaid and Markdown, templates</text><rect x="68.0" y="112.0" width="664.0" height="90.0" rx="10.0" fill="#ffffff" stroke="#d1d9e0"/><rect x="69.0" y="122.0" width="3.0" height="20.0" rx="1.5" fill="#1a7f37"/><text x="82.0" y="134.0" font-size="12.0" fill="#1f2328" font-weight="600">internal/render/svg · internal/draw</text><text x="718.0" y="134.0" font-size="10.5" fill="#59636e" text-anchor="end">layout, cards, themes, text measurement</text><rect x="90.0" y="146.0" width="620.0" height="44.0" rx="10.0" fill="#ffffff" stroke="#d1d9e0"/><rect x="91.0" y="156.0" width="3.0" height="20.0" rx="1.5" fill="#cf222e"/><text x="104.0" y="168.0" font-size="12.0" fill="#1f2328" font-weight="600">internal/tree · internal/icons</text><text x="696.0" y="168.0" font-size="10.5" fill="#59636e" text-anchor="end">the domain and the glyphs — standard library only</text><text x="24.0" y="26.0" font-size="11.5" fill="#59636e">main.go wires these together and exits — nothing below the outer layer prints, and nothing else calls os.Exit.</text><text x="24.0" y="246.0" font-size="11.5" fill="#59636e">Every box may import the boxes inside it. Nothing imports outward.</text></svg>
