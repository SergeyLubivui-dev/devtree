4 3.37752 5.08241ZM15.0595 10.4995C15.3353 10.1905 15.3085 9.71642 14.9995 9.44055C14.6905 9.16467 14.2164 9.19151 13.9405 9.50049L10.9286 12.8739L10.0595 11.9005C9.78358 11.5915 9.30947 11.5647 9.00049 11.8405C8.69151 12.1164 8.66467 12.5905 8.94055 12.8995L10.3691 14.4995C10.5114 14.6589 10.7149 14.75 10.9286 14.75C11.1422 14.75 11.3457 14.6589 11.488 14.4995L15.0595 10.4995Z" fill="currentColor"/></g><text x="584.7" y="62.0" font-size="13.5" fill="#1f2328" font-weight="600">It stays honest</text><text x="556.7" y="96.0" font-size="11.5" fill="#59636e">A pre-commit hook and a CI check</text><text x="556.7" y="112.0" font-size="11.5" fill="#59636e">refuse to let the diagram drift from</text><text x="556.7" y="128.0" font-size="11.5" fill="#59636e">the plan.</text></svg>
