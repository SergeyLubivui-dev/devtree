<svg xmlns="http://www.w3.org/2000/svg" width="800" height="186" viewBox="0 0 800 186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Why keep the plan in the repository"><style>
@keyframes dt-flow { to { stroke-dashoffset: -16 } }
@keyframes dt-grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes dt-spin { to { transform: rotate(360deg) } }
@keyframes dt-rise { from { opacity: 0; transform: translateY(7px) } to { opacity: 1; transform: none } }
@keyframes dt-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
@keyframes dt-marquee { from { transform: translateX(-50%) } to { transform: none } }
.dt-flow { animation: dt-flow 1.1s linear infinite }
.dt-grow { animation: dt-grow .9s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: left center }
.dt-spin { animation: dt-spin 8s linear infinite; transform-box: fill-box; transform-origin: center }
.dt-rise { animation: dt-rise .55s cubic-bezier(.2,.8,.2,1) backwards }
.dt-pulse { animation: dt-pulse 2.4s ease-in-out infinite }
.dt-marquee { animation: dt-marquee 26s linear infinite; transform-box: fill-box }
@media (prefers-reduced-motion: reduce), print {
  .dt-flow, .dt-grow, .dt-spin, .dt-rise, .dt-pulse, .dt-marquee { animation: none }
}
</style><rect x="0.5" y="0.5" width="799.0" height="185.0" rx="12.0" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="24.0" y="28.0" width="237.3" height="130.0" rx="10.0" fill="#ffffff" stroke="#d1d9e0"/><clipPath id="why-0"><rect x="24.0" y="28.0" width="237.3" height="130.0" rx="10.0"/></clipPath><g clip-path="url(#why-0)"><rect x="24.0" y="28.0" width="4.0" height="130.0" rx="0.0" fill="#1a7f37"/></g><g transform="translate(42.0,46.0) scale(0.8333)" style="color:#1a7f37"><path d="M9.75 12C9.75 10.7574 10.7574 9.75 12 9.75C13.2426 9.75 14.25 10.7574 14.25 12C14.25 13.2426 13.2426 14.25 12 14.25C10.7574 14.25 9.75 13.2426 9.75 12Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M2 12C2 13.6394 2.42496 14.1915 3.27489 15.2957C4.97196 17.5004 7.81811 20 12 20C16.1819 20 19.028 17.5004 20.7251 15.2957C21.575 14.1915 22 13.6394 22 12C22 10.3606 21.575 9.80853 20.7251 8.70433C19.028 6.49956 16.1819 4 12 4C7.81811 4 4.97196 6.49956 3.27489 8.70433C2.42496 9.80853 2 10.3606 2 12ZM12 8.25C9.92893 8.25 8.25 9.92893 8.25 12C8.25 14.0711 9.92893 15.75 12 15.75C14.0711 15.75 15.75 14.0711 15.75 12C15.75 9.92893 14.0711 8.25 12 8.25Z" fill="currentColor"/></g><text x="70.0" y="62.0" font-size="13.5" fill="#1f2328" font-weight="600">It gets reviewed</text><text x="42.0" y="96.0" font-size="11.5" fill="#59636e">A change to the plan lands in the</text><text x="42.0" y="112.0" font-size="11.5" fill="#59636e">diff, right next to the change to the</text><text x="42.0" y="128.0" font-size="11.5" fill="#59636e">code.</text><rect x="281.3" y="28.0" width="237.3" height="130.0" rx="10.0" fill="#ffffff" stroke="#d1d9e0"/><clipPath id="why-1"><rect x="281.3" y="28.0" width="237.3" height="130.0" rx="10.0"/></clipPath><g clip-path="url(#why-1)"><rect x="281.3" y="28.0" width="4.0" height="130.0" rx="0.0" fill="#bf8700"/></g><g transform="translate(299.3,46.0) scale(0.8333)" style="color:#bf8700"><path fill-rule="evenodd" clip-rule="evenodd" d="M13.803 5.33333C13.803 3.49238