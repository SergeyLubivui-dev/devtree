name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool writes files and walks parent directories, so the path
        # handling is worth proving on all three platforms rather than
        # assuming Linux behavior generalizes.
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # Nothing to cache: the module has no dependencies, so there is no
          # go.sum for the cache key to hash.
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  lint:
    name: Vet and gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # Nothing to cache: the module has no dependencies, so there is no
          # go.sum for the cache key to hash.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  tree:
    name: Diagram matches the plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # Nothing to cache: the module has no dependencies, so there is no
          # go.sum for the cache key to hash.
          cache: false

      # devtree plans devtree: the same check it installs into other
      # repositories runs against its own README.
      - name: Validate the plan
        run: go run . check --strict

      - name: Render the diagram
        run: go run . render

      # The README's own pictures are generated too, by the same drawing code.
      - name: Redraw the README artwork
        run: go run ./internal/art

      - name: Fail if anything generated is stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'devtree render' and 'go run ./internal/art', then commit the result."
            git diff --stat
            exit 1
          fi
