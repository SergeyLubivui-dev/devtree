name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool writes files and walks parent directories, so the path
        # handling is worth proving on all three platforms rather than
        # assuming Linux behavior generalizes.
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  lint:
    name: Vet and gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  tree:
    name: Diagram matches the plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # devtree plans devtree: the same check it installs into other
      # repositories runs against its own README.
      - name: Validate the plan
        run: go run . check --strict

      - name: Render the diagram
        run: go run . render

      - name: Fail if the diagram is stale
        run: |
          if ! git diff --quiet; then
            echo "::error::The diagram is out of date. Run 'devtree render' and commit the result."
            git diff --stat
            exit 1
          fi
