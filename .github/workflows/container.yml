name: Container

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU only has to cover the final stage: the Go build itself cross-
      # compiles on the runner's own architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: naming
        run: |
          # GHCR insists on a lowercase path, and the account name is not.
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            echo "tags=${image}:${version#v},${image}:latest" >> "$GITHUB_OUTPUT"
          else
            version="edge"
            echo "tags=${image}:edge" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.naming.outputs.tags }}
          build-args: VERSION=${{ steps.naming.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say where it went
        run: |
          echo "### Container published" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'docker run --rm -v "$PWD:/work" ${{ steps.naming.outputs.tags }}' | cut -d, -f1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
